<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

    <button id = "button1"> Play</button>
    <button id = "button2"> Play</button>
    <button id = "button3"> Play</button>
    <button id = "button4"> Play</button>
    

    <script>
        function playNote1(someContext, frequency, duration)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const osc3 = new OscillatorNode(someContext);
            
            const gain1 = new GainNode(someContext);
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.01;
            osc3.frequency.value = frequency*1.01;

            osc1.type = "triangle"
            osc2.type = "triangle"
            osc3.type = "sine"

            gain1.gain.value = 0;

            osc1.connect(gain1).connect(someContext.destination);
            osc2.connect(gain1).connect(someContext.destination);
            osc3.connect(gain1).connect(someContext.destination);

            let now = someContext.currentTime;

            gain1.gain.exponentialRampToValueAtTime(0.30, now + 0.01); //attack
            gain1.gain.exponentialRampToValueAtTime(0.15, now + 0.01 + 0.08) //decay
            gain1.gain.exponentialRampToValueAtTime(0.1, now + 0.01 + 0.08 + 0.9)
            gain1.gain.exponentialRampToValueAtTime(0.001, now + duration); //release

            osc1.start();
            osc1.stop(now + duration);

            osc2.start();
            osc2.stop(now + duration);

            osc3.start();
            osc3.stop(now + duration);
        }


        function playNote2(someContext, frequency, duration)
        {
            const osc4 = new OscillatorNode(someContext);
            const osc5 = new OscillatorNode(someContext);
            const osc6 = new OscillatorNode(someContext);

            const gain2 = new GainNode(someContext);
        
            osc4.frequency.value = frequency;
            osc5.frequency.value = frequency*1.3;
            osc6.frequency.value = frequency*1.4;

            osc4.type = "triangle"
            osc5.type = "triangle"
            osc6.type = "square"

            gain2.gain.value = 0;

            osc4.connect(gain2).connect(someContext.destination);
            osc5.connect(gain2).connect(someContext.destination);
            osc6.connect(gain2).connect(someContext.destination);
        
            let now = someContext.currentTime;

            gain2.gain.exponentialRampToValueAtTime(0.2, now + 0.1); //attack
            gain2.gain.exponentialRampToValueAtTime(0.13, now + 0.1 + 0.1) //decay
            gain2.gain.exponentialRampToValueAtTime(0.30, now + 0.1 + 0.1 + 0.5)
            gain2.gain.exponentialRampToValueAtTime(0.001, now + duration); //release

            osc4.start();
            osc4.stop(now + duration);

            osc5.start();
            osc5.stop(now + duration);

            osc6.start();
            osc6.stop(now + duration);
        }



        function playNote3(someContext, frequency, duration)
        {
            const osc7 = new OscillatorNode(someContext);
            const osc8 = new OscillatorNode(someContext);
            const osc9 = new OscillatorNode(someContext);

            const gain3 = new GainNode(someContext);

            osc7.frequency.value = frequency;
            osc8.frequency.value = frequency*1.6;
            osc9.frequency.value = frequency*0.7;

            osc7.type = "sine"
            osc8.type = "triangle"
            osc9.type = "triangle"

            gain3.gain.value = 0;

            osc7.connect(gain3).connect(someContext.destination);
            osc8.connect(gain3).connect(someContext.destination);
            osc9.connect(gain3).connect(someContext.destination);

            let now = someContext.currentTime;

            gain3.gain.exponentialRampToValueAtTime(0.20, now + 0.05); //attack
            gain3.gain.exponentialRampToValueAtTime(0.15, now + 0.05 + 0.01) //decay
            gain3.gain.exponentialRampToValueAtTime(0.60, now + 0.05 + 0.01 + 0.3)
            gain3.gain.exponentialRampToValueAtTime(0.001, now + duration); //release

            osc7.start();
            osc7.stop(now + duration);

            osc8.start();
            osc8.stop(now + duration);

            osc9.start();
            osc9.stop(now + duration);
        }


        function playNote4(someContext, frequency, duration)
        {
            const osc10 = new OscillatorNode(someContext);
            const osc11 = new OscillatorNode(someContext);
            const osc12 = new OscillatorNode(someContext);

            const gain4 = new GainNode(someContext);

            osc10.frequency.value = frequency;
            osc11.frequency.value = frequency*2.4;
            osc12.frequency.value = frequency*1.5;

            osc10.type = "triangle"
            osc11.type = "square"
            osc12.type = "square"

            gain4.gain.value = 0;

            osc10.connect(gain4).connect(someContext.destination);
            osc11.connect(gain4).connect(someContext.destination);
            osc12.connect(gain4).connect(someContext.destination);

            let now = someContext.currentTime;

            gain4.gain.exponentialRampToValueAtTime(0.30, now + 0.01); //attack
            gain4.gain.exponentialRampToValueAtTime(0.20, now + 0.01 + 0.08) //decay
            gain4.gain.exponentialRampToValueAtTime(0.03, now + 0.01 + 0.08 + 0.9)
            gain4.gain.exponentialRampToValueAtTime(0.0001, now + duration); //release

            osc10.start();
            osc10.stop(now + duration);

            osc11.start();
            osc11.stop(now + duration);

            osc12.start();
            osc12.stop(now + duration);
        }
        
        const myCtx = new AudioContext();
        let freq1 = 220
        let freq2 = 240
        let freq3 = 200
        let freq4 = 1220

        document.querySelector("#button1").onclick = () => playNote1(myCtx, freq1, 1);
        document.querySelector("#button2").onclick = () => playNote2(myCtx, freq2, 1);
        document.querySelector("#button3").onclick = () => playNote3(myCtx, freq3, 1);
        document.querySelector("#button4").onclick = () => playNote4(myCtx, freq4, 1);
    </script>
    
</body>

</html>
