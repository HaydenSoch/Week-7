<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> SLIIDEEEEERRRRSSS LETSSSS GOOOOOOOOO</title>
    </head>
    <body>
<button id="startButton1">Start</button>
<input id = "freq1" type="range" min ="1" max = "38" step="0.1" value="0.1"><label id = "CutOff_Display1">CutOff_Range</label>
<input id = "rate1" type="range" min ="0.125" max = "15" step="0.001" value="1"><label id = "Rate_Display1">Rate_Range</label>
<button id="startButton2">Start</button>
<input id = "freq2" type="range" min ="0.2" max = "60" step="0.1" value="0.1"><label id = "CutOff_Display2">CutOff_Range</label>
<input id = "rate2" type="range" min ="0.01" max = "20" step="0.001" value="2"><label id = "Rate_Display2">Rate_Range</label>
<button id="startButton3">Start</button>
<input id = "freq3" type="range" min ="1" max = "38" step="0.1" value="0.1"><label id = "CutOff_Display3">CutOff_Range</label>
<input id = "rate3" type="range" min ="0.2" max = "25" step="0.001" value="3"><label id = "Rate_Display3">Rate_Range</label>
<div id="result">SLIIDEEEEERRRRSSS LETSSSS GOOOOOOOOO</div>
<script>


// 1. Initialize the Audio Context
const ctx = new AudioContext();

function playNote1(){
mainOsc1.start();
lfo1.start();

// 2. Create the main audio source
const mainOsc1 = new OscillatorNode(ctx);
mainOsc1.type = 'triangle';
mainOsc1.frequency.value = 55;


// 3. Create the Low Pass Filter
const lpFilter1 = new BiquadFilterNode(ctx);
lpFilter1.type = 'lowpass';
lpFilter1.frequency = 1000; // Base cutoff frequency
lpFilter1.Q = 8;           // Add resonance for a more noticeable sweep
}; ////////PUT THE STUFF IN EACH OF THEIR FUNCTIONSSSSSS!!!!!!

// 2. Create the main audio source

const mainOsc2 = new OscillatorNode(ctx);
mainOsc2.type = 'square';
mainOsc2.frequency.value = 65;

const mainOsc3 = new OscillatorNode(ctx);
mainOsc3.type = 'sawtooth';
mainOsc3.frequency.value = 45;

// 3. Create the Low Pass Filter

const lpFilter2 = new BiquadFilterNode(ctx);
lpFilter2.type = 'lowpass';
lpFilter2.frequency = 600;  // Base cutoff frequency
lpFilter2.Q = 10;           // Add resonance for a more noticeable sweep

const lpFilter3 = new BiquadFilterNode(ctx);
lpFilter3.type = 'lowpass';
lpFilter3.frequency = 800;
lpFilter3.Q = 6; 

// 4. Create the LFO
const lfo1 = new OscillatorNode(ctx);
lfo1.type = 'sine'; 
lfo1.frequency.value = 1; // Speed of modulation (3 Hz / 3 times per second)

const lfo2 = new OscillatorNode(ctx);
lfo2.type = 'sine'; 
lfo2.frequency.value = 2;

const lfo3 = new OscillatorNode(ctx);
lfo3.type = 'sine'; 
lfo3.frequency.value = 0.75;

// 5. Create the LFO Gain Node to control modulation depth
const lfoDepth1 = new GainNode(ctx);
lfoDepth1.gain.value = 0.98; // Modulates the cutoff by +/- 500Hz (Sweep range: 300Hz to 1300Hz)

const lfoDepth2 = new GainNode(ctx);
lfoDepth2.gain.value = 0.8;

const lfoDepth3 = new GainNode(ctx);
lfoDepth3.gain.value = 0.5;

// 6. Connect the modulation graph
lfo1.connect(lfoDepth1);
lfoDepth1.connect(lpFilter1.frequency); // Target the filter's frequency parameter

lfo2.connect(lfoDepth2);
lfoDepth2.connect(lpFilter2.frequency);

lfo3.connect(lfoDepth3);
lfoDepth3.connect(lpFilter3.frequency);

// 7. Connect the main audio signal path
mainOsc1.connect(lpFilter1);
lpFilter1.connect(ctx.destination);

mainOsc2.connect(lpFilter2);
lpFilter2.connect(ctx.destination);

mainOsc3.connect(lpFilter3);
lpFilter3.connect(ctx.destination);

// 8. Start both oscillators
function playNote1(){
mainOsc1.start();
lfo1.start();
};
function playNote2(){
mainOsc2.start();
lfo2.start();
};
function playNote3(){
mainOsc3.start();
lfo3.start();
};

const slider1 = document.querySelector("#freq1");
    slider1.addEventListener("input", () => {
    ctx.resume();
    lfoDepth1.gain.value = 100 * (Number(slider1.value));
    document.querySelector("#CutOff_Display1").textContent = slider1.value;
    });

const slider2 = document.querySelector("#rate1");
    slider2.addEventListener("input", () => {
    ctx.resume();
    lfo1.frequency.value = (Number(slider2.value));
    document.querySelector("#Rate_Display1").textContent = slider2.value;
    });

const slider3 = document.querySelector("#freq2");
    slider3.addEventListener("input", () => {
    ctx.resume();
    lfoDepth2.gain.value = 100 * (Number(slider3.value));
    document.querySelector("#CutOff_Display2").textContent = slider3.value;
    });

const slider4 = document.querySelector("#rate2");
    slider4.addEventListener("input", () => {
    ctx.resume();
    lfo2.frequency.value = (Number(slider4.value));
    document.querySelector("#Rate_Display2").textContent = slider4.value;
    });

const slider5 = document.querySelector("#freq3");
    slider5.addEventListener("input", () => {
    ctx.resume();
    lfoDepth3.gain.value = 100 * (Number(slider5.value));
    document.querySelector("#CutOff_Display3").textContent = slider5.value;
    });

const slider6 = document.querySelector("#rate3");
    slider6.addEventListener("input", () => {
    ctx.resume();
    lfo3.frequency.value = (Number(slider6.value));
    document.querySelector("#Rate_Display3").textContent = slider6.value;
    });

document.querySelector("#startButton1").onclick = () => playNote1();
document.querySelector("#startButton2").onclick = () => playNote2();
document.querySelector("#startButton3").onclick = () => playNote3();
 </script>    
 </body>
</html>
