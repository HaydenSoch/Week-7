<!DOCTYPE html>
<html lang = "en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content ="width=device-width, initial-scale=1.0">
<title>Randomer Pitches Yes</title>
</head>
<body>
    <button id="pickButton">Pick Random Note</button>
    <div id="result">Click the button to start!</div>

    <script>
            //define the array of choices
            const midiPitches = [60, 62, 63, 67, 69, 72];

            //create the random picker function
            const randomPitch = function(){
                let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
                let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);
                return newFreq;
            }

            //set up references to the HTMl elements
            const button = document.getElementById("pickButton");
            const resultDisplay = document.getElementById("result");

            //Trigger the function on click and print the result
            button.addEventListener("click", function(){
                const randomChoice = randomPitch(midiPitches);
                resultDisplay.textContent = randomChoice;
            });
    </script>
</body>
</html>
